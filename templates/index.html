<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Deployment Demo</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;color:#1f2937}
  .wrap{max-width:720px;margin:0 auto;padding:24px}
  h1{margin-bottom:4px}
  .badges span{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;
    padding:3px 12px;font-size:13px;margin:0 6px 6px 0}
  .card{background:#fff;border-radius:12px;padding:18px;margin:16px 0;
    box-shadow:0 1px 4px rgba(0,0,0,.08)}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;
    border:1px solid #cbd5e1;border-radius:8px;font:inherit}
  button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:10px 18px;
    font:inherit;cursor:pointer}
  .msg{border-bottom:1px solid #eef0f4;padding:10px 0}
  .msg:last-child{border:0}
  .meta{font-size:12px;color:#6b7280}
  a{color:#4f46e5}
</style>
</head>
<body>
<div class="wrap">
  <h1>☁️ Cloud Deployment Demo</h1>
  <div class="badges">
    <span>Flask on cloud compute</span>
    <span>Managed DB: {{ db }}</span>
    <span>Env: {{ env }}</span>
    <span><a href="/health">/health</a></span>
  </div>

  <div class="card">
    <h3>Leave a message</h3>
    <form method="post" action="/add">
      <input name="name" placeholder="Your name" maxlength="80" required>
      <textarea name="body" rows="3" placeholder="Your message" maxlength="500" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>

  <div class="card">
    <h3>Messages stored in the cloud database</h3>
    {% for m in messages %}
      <div class="msg"><strong>{{ m.name }}</strong>
        <div>{{ m.body }}</div>
        <div class="meta">{{ m.created_at }}</div></div>
    {% else %}
      <p class="meta">No messages yet. Be the first!</p>
    {% endfor %}
  </div>
</div>
</body>
</html>
